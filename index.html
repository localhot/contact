<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  body{font-family:system-ui,sans-serif;text-align:center;margin-top:30vh}
  a{display:inline-block;padding:1rem 2rem;border-radius:12px;background:#1a73e8;color:#fff;text-decoration:none;font-size:1.3rem}
</style>
<div id="o"></div>
<script>
var p = decodeURIComponent(location.hash.slice(1)).split(",");
var a = p[0], n = p[1] || "", name = p[2] || "";
var android = /android/i.test(navigator.userAgent);
if (a === "call") {
  location.replace("tel:" + n);
} else if (a === "save") {
  if (android) {
    document.getElementById("o").innerHTML =
      '<a href="intent://contacts/people/#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.phone=' +
      encodeURIComponent(n) + ';S.name=' + encodeURIComponent(name) + ';end">Save contact</a>';
  } else {
    location.replace("contact.vcf");
  }
}
</script>
